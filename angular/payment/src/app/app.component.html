
  <div id="wait-message" *ngIf="!pageLoaded">Chargement en cours...</div>
  
  <div id="payment-wrapper" *ngIf="pageLoaded" class="payment">
    <div class="row">
      <div class="col-sm-12">
        <form id="new-event-form" (submit)="addEvent()">
          <label>Ajouter une activité à la liste des paiements&nbsp;:</label>
          <input id="new-event-input" [(ngModel)]="newEventInput" class="form-control medium" placeholder="Nom de l'activité">
          <input type="submit" class="btn btn-primary" value="Ajouter" />
        </form>
      </div>
    </div>
    <div class="vertical-divider"></div>
    <div class="row">
      <table class="table table-striped table-hover payment-table" *ngIf="events.length">
        <tr>
          <th class="name-column"></th>
          <th class="count-column"></th>
          <th (click)="shiftLeft()" class="navigation-column">
            <span class="pointer-cursor" *ngIf="minId > events[0].id">&lt;&lt;&lt;</span>
          </th>
          <ng-container *ngFor="let event of events">
            <th class="payment-column" *ngIf="event.id <= maxId && event.id >= minId">
              <span>{{ event.name }}
                <a class="remove-event" (click)="remove(event)"><span class="glyphicon glyphicon-remove"></span></a>
              </span>
            </th>
          </ng-container>
          <th (click)="shiftRight()" class="navigation-column">
            <span class="pointer-cursor" *ngIf="maxId < events[events.length - 1].id">&gt;&gt;&gt;</span>
          </th>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <ng-container *ngFor="let event of events">
            <td *ngIf="event.id <= maxId && event.id >= minId">
              <span class="glyphicon glyphicon-check pointer-cursor payment-paid" (click)="setAll(event, true)" title="Tous payés"></span>
              –
              <span class="glyphicon glyphicon-unchecked pointer-cursor payment-unpaid" (click)="setAll(event, false)" title="Tous non payés"></span>
            </td>
          </ng-container>
          <td></td>
        </tr>
        <tr *ngFor="let member of members">
          <td>
            {{ member.name }}
          </td>
          <td>
            <span class="payment-paid">{{ countMemberStatus(member, true) }}</span>
            –
            <span class="payment-unpaid">{{ countMemberStatus(member, false) }}</span>
          </td>
          <td></td>
          <ng-container *ngFor="let event of events">
            <td (click)="toggle(member, event)" class="pointer-cursor" *ngIf="event.id <= maxId && event.id >= minId">
              <span *ngIf="member.status['event_' + event.id]" class="payment-paid">Payé</span>
              <span *ngIf="!member.status['event_' + event.id]" class="payment-unpaid">Non payé</span>
            </td>
          </ng-container>
          <td></td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <ng-container *ngFor="let event of events">
            <td *ngIf="event.id <= maxId && event.id >= minId">
          </ng-container>
          <td></td>
        </tr>
        <tr>
          <th>TOTAL</th>
          <td></td>
          <td></td>
          <ng-container *ngFor="let event of events">
            <td *ngIf="event.id <= maxId && event.id >= minId">
              <span class="payment-paid">{{ countWithStatus(event, true) }}</span>
              –
              <span class="payment-unpaid">{{ countWithStatus(event, false) }}</span>
            </td>
          </ng-container>
          <td></td>
        </tr>
      </table>
    </div>
    <div id="pending-commit" *ngIf="unsynchronized"><span class="glyphicon glyphicon-refresh"></span></div>
  </div>
